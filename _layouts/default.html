<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% include head-custom.html %}
</head>
<body>

<header class="site-header wrap">
  <h1 class="site-name"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
  <p class="site-tag">{{ site.position }}, {{ site.institution }}</p>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}"{% if page.nav == 'about' %} class="active"{% endif %}>About</a>
    <a href="{{ '/research.html' | relative_url }}"{% if page.nav == 'research' %} class="active"{% endif %}>Research</a>
    <a href="{{ '/teaching.html' | relative_url }}"{% if page.nav == 'teaching' %} class="active"{% endif %}>Teaching</a>
    <a href="{{ site.cv_url | relative_url }}">CV</a>
  </nav>
</header>

<main class="wrap">
{{ content }}
</main>

<footer class="site-footer wrap">
  {{ site.title }} &middot; {{ site.institution }} &middot;
  <a href="mailto:{{ site.email }}">email</a>
</footer>

</body>
</html>
